[project]
name = "bimpolars"
dynamic = ["version"]
description = "Building Information Models in polars DataFrames with geometry columns"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Joost Gevaert", email = "dev@joost.engineer" }]
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.9.0",
    "numpy>=2.0",
    "polars>=2.0",
    "shapely>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
geobim = ["pyproj>=3.7"]

[project.urls]
Repository = "https://github.com/bedrock-engineer/bimpolars"
Issues = "https://github.com/bedrock-engineer/bimpolars/issues"

[dependency-groups]
dev = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "mypy>=1.14",
    "pyarrow>=16",
    "pyproj>=3.7",
    "pytest>=8.3",
    "ruff>=0.9",
    "trimesh>=4.0",
    "types-shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bimpolars/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bimpolars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: reads a large model (hundreds of MB); run with `uv run pytest -m slow`",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ifcopenshell", "ifcopenshell.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ifcopenshell's API is only partly typed
module = ["bimpolars.ifc"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D", "W", "RUF"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
