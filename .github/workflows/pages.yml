name: Pages

# The demo page: Sixty5's structural model, read with read_ifc and placed with its Engineering
# CRS, in specklewidgets' GeoSpeckleViewer beside a MapLibre map of the selected element's
# footprint (the geog column). The page lives in bedrock-engineer/specklestuff (site/), which
# publishes it too; this builds it from specklestuff's main, so both sites show the same page,
# each under its own title.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specklestuff
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bedrock-engineer/specklestuff
          path: specklestuff
      # pnpm at the version of specklestuff's packageManager
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: specklestuff/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: specklestuff/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just setup
      - name: Cache test data
        uses: actions/cache@v4
        with:
          path: ~/.cache/bimpolars
          key: bimpolars-site-data-sixty5
      # specklestuff's site/sixty5.py turns PROJ's network on: PROJ fetches the NSGI grids from
      # cdn.proj.org, so that PDOK's 3D BAG stands on the map
      - run: just site
        env:
          # bimpolars' header: specklestuff's site/intro/bimpolars.html
          SITE: bimpolars
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: specklestuff/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
